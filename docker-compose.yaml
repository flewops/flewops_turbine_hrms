version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: odoo_postgres_20
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:20
    container_name: odoo_app_20
    depends_on:
      - postgres
    ports:
      - "8069:8069"
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    command: >
      odoo
      --db_host=postgres
      --db_user=odoo
      --db_password=odoo
      --http-interface=0.0.0.0
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/usr/lib/python3/dist-packages/addons,/mnt/extra-addons
      --dev=reload

volumes:
  postgres_data:
  odoo_data: